name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS application
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Create ZIP
        run: |
          cd dist
          zip -r AttendanceSystem-macOS.zip AttendanceSystem.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceSystem-macOS
          path: dist/AttendanceSystem-macOS.zip
